services:
  weol-agent:
    build: .
    container_name: weol-agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      HTTP_HOST: "0.0.0.0"
      HEADLESS: "true"
    volumes:
      # cookies / storageState между рестартами
      - ./data:/app/data
    # Chromium в контейнере без достаточного /dev/shm часто падает
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
